# Anotações do dataset de avaliação (versão 1): o que se espera de cada imagem do manifest.yml.
#
# expect: food (itens esperados), no_food (sem comida), unreadable (ilegível), injection (texto na imagem que tenta dar ordem ao modelo).
# items: nomes em português do Brasil, como se pede ao modelo. `grams` é o peso medido, só nos pratos do Nutrition5k
#   (soma por ingrediente do CSV de metadados, ingredientes com 20 g ou mais e com nome mapeado; temperos e óleo ficam de fora).
#   `source_name` é o nome do ingrediente no Nutrition5k.
# Pratos do MyFood e da UNIFEI: itens anotados pelo projeto olhando cada imagem, só o que se vê com clareza, sem gramas.
#   Os conjuntos publicam máscaras por classe, não a lista de itens do prato.
# catalog_truth: para cada nome esperado, os itens do catálogo que o projeto aceita como o certo (lista), ou `null` quando
#   o catálogo não tem nada aceitável. Serve à calibração do MATCH_THRESHOLD (evaluation/catalog_check.rb); é um julgamento do
#   projeto, sem revisão de nutricionista.
