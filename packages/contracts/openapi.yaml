openapi: 3.1.1
info:
  title: Product API
  version: 0.1.0
  description: Source of truth for the API. Change this file first, then the implementation and clients.
paths:
  /health/live:
    get:
      operationId: getHealthLive
      summary: Confirms the process responds, without touching dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLive"
        default:
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Reports whether the database and the queue service are reachable.
      responses:
        "200":
          description: Every dependency is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Any error, in the central format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthLive:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    HealthReady:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties: false
          required: [database, queue]
          properties:
            database:
              $ref: "#/components/schemas/CheckResult"
            queue:
              $ref: "#/components/schemas/CheckResult"
    CheckResult:
      type: string
      enum: [ok, error]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  field:
                    type: string
                  code:
                    type: string
