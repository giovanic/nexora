openapi: 3.1.1
info:
  title: Product API
  version: 0.1.0
  description: Source of truth for the API. Change this file first, then the implementation and clients. Every response of the API (success or error) carries Cache-Control no-store, since each one is about one person.
security:
  - bearerSession: []
  - cookieSession: []
paths:
  /health/live:
    get:
      operationId: getHealthLive
      security: []
      summary: Confirms the process responds, without touching dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLive"
        default:
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      operationId: getHealthReady
      security: []
      summary: Reports whether the database and the queue service are reachable.
      responses:
        "200":
          description: Every dependency is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/registrations:
    post:
      operationId: createRegistration
      summary: Creates an account and its first session. Requires the adult declaration.
      description: |
        With client "mobile" the body carries the token. With client "web" the session goes in the
        __Host-session cookie (HttpOnly, Secure, SameSite=Lax) and the body has no token; the request
        then needs an allowed Origin. An existing e-mail answers 422 email_taken.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionGranted"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: Lists the active sessions of the signed-in person, one per device.
      responses:
        "200":
          description: The active sessions, most recently used first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSession
      summary: Signs in with e-mail and password.
      description: |
        Same transport rules as the registration. A wrong password and an unknown e-mail both
        answer 401 invalid_credentials, with the same message.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionGranted"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Swaps the current session token for a new one and revokes the old one.
      description: |
        Of two refreshes with the same token, only one succeeds; the other answers 401. The new
        session keeps the absolute deadline of the old one. The token comes from the Bearer header
        (the new token is in the body) or from the cookie (a new cookie is set).
      responses:
        "200":
          $ref: "#/components/responses/SessionGranted"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/current:
    delete:
      operationId: deleteCurrentSession
      summary: Signs out of this device.
      responses:
        "204":
          description: The session was revoked, and the cookie, if any, cleared.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}:
    delete:
      operationId: deleteSession
      summary: Signs another device out. Another person's session answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session was revoked.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/password_resets:
    post:
      operationId: requestPasswordReset
      summary: Sends a password reset link, valid for 15 minutes and for one use.
      description: |
        Always answers 202 with no body, whether the e-mail has an account or not, so the answer
        never tells if an account exists. The link points to the web page at APP_WEB_URL and carries
        the token in the fragment (#token=...), which browsers do not send to servers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Accepted. A link is sent only if the e-mail has an account.
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/password_resets/{token}:
    patch:
      operationId: resetPassword
      summary: Sets a new password with the token from the reset link.
      description: |
        Ends every session of the account and does not sign in; the person signs in again with the
        new password. A used, expired or unknown token answers 422 invalid_token. A password that
        breaks the rules answers 422 validation_failed, and the token stays usable.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The token from the link fragment. It only has URL-safe characters.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmation"
      responses:
        "204":
          description: The password was changed and every session revoked.
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/account:
    delete:
      operationId: deleteAccount
      summary: Deletes the signed-in person's account, after the password is typed again.
      description: |
        Works without the health_data consent. Every session of the account, on every device, ends
        at once, and the web cookie is cleared. The data of every context is then erased in the
        background, within 24 hours; what stays is the account's UUID with no e-mail or password,
        and the consent and audit records linked to it, with no content. The same e-mail can sign
        up again once the erasure ends. A wrong or missing password answers 401
        invalid_credentials and deletes nothing. Attempts are limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
      responses:
        "202":
          description: Accepted. The sessions are revoked and the erasure is scheduled.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/account/export:
    post:
      operationId: exportAccount
      summary: Exports all the signed-in person's data, after the password is typed again.
      description: |
        Works without the health_data consent. The body is built on the spot from every context
        that holds the person's data, keyed by context, and is never stored; the answer carries
        Cache-Control no-store. It holds no password, token or key digest. A wrong or missing
        password answers 401 invalid_credentials and exports nothing. Attempts are limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountExportRequest"
      responses:
        "200":
          description: The person's data, one entry per context.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/consents:
    get:
      operationId: listConsents
      summary: Lists every purpose of consent with its state for the signed-in person.
      description: |
        The state comes from the latest record of each purpose. Every grant and revoke is kept as
        history. Pending means the person was never asked or never answered.
      responses:
        "200":
          description: One entry per purpose, always in the same order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentList"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: grantConsent
      summary: Grants a purpose, accepting the current version of its text.
      description: |
        A version other than the current one answers 409 outdated_version, so the app shows the
        current text again. Granting a purpose already granted with that version writes nothing new.
        An unknown purpose answers 422 validation_failed. Granting health_data again while its earlier
        withdrawal is not yet applied (the profile's health information is still being erased,
        usually under a minute) answers 409 revocation_pending; the app tries again shortly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentGrantRequest"
      responses:
        "201":
          description: The purpose is granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/consents/{purpose}:
    delete:
      operationId: revokeConsent
      summary: Revokes a purpose. Revoking one that is not granted writes nothing.
      description: |
        health_data is revoked like any other purpose (owner decision of 2026-11-13): the profile's
        health information is erased afterwards, the account stays, and the health routes answer
        403 consent_required until it is granted again. An unknown purpose answers 404.
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The purpose is revoked.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/consents/{purpose}/text:
    get:
      operationId: getConsentText
      summary: The text of the current version of a purpose, in Markdown. An unknown purpose answers 404.
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The current text, to show before asking for the consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentText"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profile:
    get:
      operationId: getProfile
      summary: The profile of the signed-in person. Needs the health_data consent.
      description: |
        The profile is created from the sign-up, shortly after it. Until then this answers
        409 profile_pending; try again in a moment. Without health_data it answers 403 consent_required.
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProfile
      summary: Changes the fields sent and leaves the others as they are.
      description: |
        Nothing is saved unless every field is valid. A time zone unknown to the IANA database answers
        422 invalid_time_zone. Motivations outside the list, or more than 4, answer 422 validation_failed.
        Needs the health_data consent. Before the profile exists it answers 409 profile_pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The profile after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sport_profiles:
    get:
      operationId: listSportProfiles
      summary: The sports the signed-in person practices now, with the level of each.
      description: Needs the health_data consent. Before the profile exists it answers 409 profile_pending.
      responses:
        "200":
          description: One entry per active sport.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportProfileList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: setSportProfile
      summary: Adds a sport or changes its level.
      description: |
        Changing the level ends the current entry and starts a new one, so the history is kept. Sending
        the level already set changes nothing. A sport or level outside the lists answers 422
        validation_failed. Needs the health_data consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportProfileRequest"
      responses:
        "201":
          description: The entry in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportProfile"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sport_profiles/{id}:
    delete:
      operationId: removeSportProfile
      summary: Stops a sport. The entry is ended, not erased, so the history stays.
      description: Another person's entry, an ended one or an unknown id answers 404. Needs the health_data consent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The sport was stopped.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/foods/search:
    post:
      operationId: searchFoods
      summary: Searches the food catalog by name, ignoring case and accents.
      description: |
        Used to correct a meal. The term travels in the body, never in the URL, and is filtered from the
        logs. The catalog holds USDA FoodData Central ingredients and dishes written by the project
        (kind composition, shown as "composição própria"). Items are ordered by closeness to the term,
        dishes first on a tie. per_page is capped at 50 (20 when omitted). A missing or blank term, a term
        over 100 characters, or a page below 1 or above 1000 answers 422 validation_failed. Needs the health_data consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodSearchRequest"
      responses:
        "200":
          description: A page of catalog items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSearchPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/food_entries/uploads:
    post:
      operationId: startFoodEntryUpload
      summary: Authorizes the upload of a meal photo and starts the pending meal.
      description: |
        Checks that food_photo_ai is granted for the version in force and that this version names the
        operator and region the server really uses (403 consent_required, 403 consent_operator_mismatch),
        then the daily quota of 20 authorized uploads per local day (429 analysis_quota_exceeded, with
        Retry-After in seconds until local midnight). content_type is image/jpeg, image/png, image/webp, image/heic or image/heif
        (HEIC and HEIF are converted to JPEG by the server before analysis; other types, such as image/gif,
        answer 422 unsupported_media_type) and byte_size is at most
        10 MB. meal_at needs a UTC offset and falls between 30 days ago and 1 day ahead (422 validation_failed
        otherwise). Creates a pending meal and returns a signed PUT URL valid for 15 minutes; the PUT must send
        exactly upload_headers. Repeating a client_request_id returns the same meal with a new URL and
        counts once (201), as long as the photo still awaits its upload. Once it does not, the repeat
        answers 200 with the same food_entry_id and the meal status, and no URL (upload_url, upload_headers
        and expires_at are null). If the upload was abandoned and swept before it went on to the analysis,
        the repeat answers 409 upload_expired and creates no meal: the app starts over with a new
        client_request_id. A 422 carries details naming the field (client_request_id, byte_size, meal_at
        or, for unsupported_media_type, content_type) and a code, so the app can choose its message.
        The URL is a secret: never log it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodEntryUploadRequest"
      responses:
        "200":
          description: The client_request_id was already used and its photo is past the upload. No new URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntryUpload"
        "201":
          description: The meal was started and the upload is authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntryUpload"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/food_entries/{id}/analysis:
    post:
      operationId: requestFoodEntryAnalysis
      summary: Asks for the analysis of the photo of a meal, once the photo was uploaded.
      description: |
        The meal must be pending or failed (a failed one can be asked again). FoodAi checks the object
        against what was authorized and that food_photo_ai is still granted, then the work runs in the
        background: the answer is 202 and the meal is processing. Another person's or an unknown meal
        answers 404; a meal in any other state answers 409 entry_not_analyzable; 422 not_uploaded when
        the object was not sent, 422 invalid_photo (details: field photo, code size_mismatch or
        type_mismatch) when it differs from the authorization; 403 consent_required or
        consent_operator_mismatch. A refusal leaves the meal as it was. A photo takes the first request and
        two more after a failure: the next answers 409 analysis_retry_limit (the app offers another photo or
        a meal written by hand). A new request after a failure counts the photo's unit again in the quota of
        today: 429 analysis_quota_exceeded, with Retry-After, when the day is used up. One person may ask
        10 times a minute (429, Retry-After 60).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: The analysis was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntryAnalysisAccepted"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/food_entries/{id}:
    get:
      operationId: getFoodEntry
      summary: A meal with its items, calorie and macro ranges, confidence and photo.
      description: |
        Everything the app shows comes from here; the app computes nothing. Calories are always a range
        (calories_min, calories_likely, calories_max) rounded to the ten, macros a range rounded to the
        gram, and every number is null while there is nothing to show (processing, no food, no known item).
        estimate_partial is true when some item is unknown to the catalog: the range then sums only the known
        items, and an unknown item carries its name and no numbers. confidence is high, medium or low, and
        null without items. source is the nutrition base of an item (usda_fdc or project); own_composition is
        true for a dish composed by the project. There is no total of the day, no remaining and no goal.
        photo_url is a signed URL valid for 15 minutes, only while the photo exists, and a secret: never log
        it. Another person's or an unknown meal answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The meal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteFoodEntry
      summary: Deletes a meal, its items, its photo and the analysis result.
      description: |
        Works in any state, also while the analysis runs (the job then ends without creating anything). The
        items go with the meal; the photo and the model's raw result are erased after the meal is gone. Another
        person's or an unknown meal answers 404. It does not need the health_data consent: erasing a meal stays
        possible after that consent is revoked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The meal is gone.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/food_entries:
    get:
      operationId: listFoodEntries
      summary: The history of meals, newest day first, by cursor.
      description: |
        Meals of the person ordered by local_date, meal_at and id, newest first, 20 per page (per_page up to
        50; larger values are served as 50). local_date (YYYY-MM-DD) narrows the list to one local day. cursor is
        the opaque next_cursor of the previous page; a cursor that is not one answers 422 validation_failed.
        A meal still waiting for its photo (pending) is not listed. Each meal is the same FoodEntry as
        getFoodEntry, with its own ranges; there is no total of the day, no sum and no comparison. photo_url is
        always null here (the list shows no photo and signs no URL): getFoodEntry gives the signed URL. The
        response is never cached.
      parameters:
        - name: local_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: A page of meals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntryPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createManualFoodEntry
      summary: Registers a meal by hand, with no photo, already confirmed.
      description: |
        The meal is born confirmed, with source manual, no photo and no use of the daily photo quota. It needs
        1 to 30 items, each with a catalog_item_id or a free_text_name (up to 80 characters), and grams from 1 to
        2000. A free-text item is unknown: it has no numbers and makes the estimate partial. Repeating a
        client_request_id returns the same meal (200); a client_request_id already used for a photo meal answers
        422 validation_failed. meal_at follows the same rule as the upload (UTC offset required, 30 days back, 1
        day ahead). Details name the field, such as items.0.grams_likely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualFoodEntryRequest"
      responses:
        "200":
          description: The client_request_id was already used; the same meal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "201":
          description: The meal was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/food_entries/{id}/confirmation:
    post:
      operationId: confirmFoodEntry
      summary: Confirms an analyzed meal as it stands.
      description: |
        Needs an analyzed meal with at least one item. Confirming a confirmed meal answers 200 again and changes
        nothing. A meal still processing, pending or failed, or with no item, answers 409 entry_not_confirmable.
        Another person's or an unknown meal answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The confirmed meal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/food_entries/{id}/items:
    post:
      operationId: addFoodEntryItem
      summary: Adds an item to an analyzed or confirmed meal and recalculates it.
      description: |
        Exactly one of catalog_item_id (a catalog food, 422 when unknown) or free_text_name (1 to 80
        characters). grams_likely is required, from 1 to 2000; grams_min and grams_max default to it and must
        keep min <= likely <= max, each from 1 to 2000. The item has origin user. A free-text item is unknown: no
        numbers, and the estimate becomes partial. A meal that is not analyzed or confirmed answers 409
        entry_not_editable. Answers the whole meal, recalculated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodItemInput"
      responses:
        "201":
          description: The meal with the new item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/food_entries/{id}/items/{item_id}:
    patch:
      operationId: correctFoodEntryItem
      summary: Corrects the portion or the food of an item and recalculates the meal.
      description: |
        Needs grams_likely (1 to 2000, 422 validation_failed otherwise and nothing changes), a catalog_item_id,
        or both. The correction creates a new item with origin user and keeps the original out of sight (still
        stored). A new grams_likely derives grams_min and grams_max keeping the proportion of the original; a new
        catalog_item_id takes the name and the nutrients from the catalog. The item in the response has a new id.
        An item already corrected or removed answers 404. A meal that is not analyzed or confirmed answers 409
        entry_not_editable. Answers the whole meal, recalculated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodItemCorrection"
      responses:
        "200":
          description: The meal with the corrected item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFoodEntryItem
      summary: Removes an item from the meal and recalculates it.
      description: |
        The item leaves the meal and the numbers; its row is kept out of sight, not deleted. A meal that is not
        analyzed or confirmed answers 409 entry_not_editable; an item already removed or corrected answers 404.
        Answers the whole meal, recalculated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The meal without the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/goal_types:
    get:
      operationId: listGoalTypes
      summary: The kinds of daily habit goal a person can create.
      description: |
        A closed list of five habit types. There is no goal for calories, deficit, weight or compensating food
        with exercise, and none can be created.
      responses:
        "200":
          description: The goal types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalTypeList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/goals:
    get:
      operationId: listGoals
      summary: The live goals (active and paused) with today and yesterday marked.
      description: |
        today_local_date and yesterday_local_date are the person's local days, the only two the person can
        mark. Active goals come first, then paused ones. done_today and done_yesterday say whether the day is
        done, by hand or by a confirmed meal. There is no streak, total or percentage.
      responses:
        "200":
          description: The goals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGoal
      summary: Creates a daily habit goal.
      description: |
        Creating a type the person already has live (active or paused) answers 200 with the same goal. A type
        outside the closed list answers 422 validation_failed with details code unsupported_goal_type, and no
        goal is created. goal_type is a plain string in the request so the refusal comes from the domain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "200":
          description: The person already had this goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "201":
          description: The goal was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/goals/history:
    get:
      operationId: listGoalHistory
      summary: Days the person completed a goal, newest first, by cursor.
      description: |
        Only completed days are listed, ended goals included. goal_id narrows the list to one goal (another
        person's or an unknown goal answers 404). limit goes from 1 to 100 (default 30); a limit outside that
        range or a cursor that is not a next_cursor answers 422 validation_failed. No missed day is ever listed.
      parameters:
        - name: goal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: A page of completed days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalHistoryPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/goals/{id}:
    patch:
      operationId: changeGoalStatus
      summary: Pauses, resumes or ends a goal.
      description: |
        status is active, paused or ended; any other value answers 422 validation_failed. An ended goal is
        final: any change answers 409 goal_not_active. Another person's or an unknown goal answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeGoalStatusRequest"
      responses:
        "200":
          description: The goal with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteGoal
      summary: Deletes a goal and its check-ins.
      description: |
        Another person's or an unknown goal answers 404. It does not need the health_data consent: erasing a
        goal stays possible after that consent is revoked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The goal is gone.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/goals/{id}/check_ins:
    post:
      operationId: checkInGoal
      summary: Marks a day of the goal as done by hand.
      description: |
        local_date is today or yesterday in the person's time zone; another day answers 422 validation_failed
        with details code outside_window (or invalid for a malformed date). Repeating it changes nothing. A goal
        that is not active answers 409 goal_not_active. Another person's or an unknown goal answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInRequest"
      responses:
        "200":
          description: The day of the goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalDay"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/goals/{id}/check_ins/{local_date}:
    delete:
      operationId: uncheckGoal
      summary: Removes the manual check-in of a day.
      description: |
        Same window and answers as checkInGoal. A check-in that came from a confirmed meal stays, so done can
        remain true, with sources food_entry.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: local_date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The day of the goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalDay"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: Session token of the mobile app.
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Session cookie of the web app. State-changing requests need an allowed Origin.
  responses:
    SessionGranted:
      description: A session was opened. Mobile gets the token in the body; web gets the cookie.
      headers:
        Set-Cookie:
          description: Only for the web client, __Host-session with HttpOnly, Secure, SameSite=Lax and Path=/.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionGrant"
    TooManyRequests:
      description: Too many attempts. Retry after the given number of seconds.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Any error, in the central format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Client:
      type: string
      enum: [web, mobile]
      description: Decides the transport, the token in the body (mobile) or the cookie (web).
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password, adult_confirmed, time_zone, client]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 12
          description: From 12 characters to 72 bytes, the bcrypt limit.
        adult_confirmed:
          type: boolean
          description: Must be true. The declaration does not prove age.
        time_zone:
          type: string
          description: IANA time zone of the device, such as America/Sao_Paulo. Unknown zones answer 422 invalid_time_zone.
        client:
          $ref: "#/components/schemas/Client"
        device_label:
          type: [string, "null"]
          maxLength: 100
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password, client]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
        client:
          $ref: "#/components/schemas/Client"
        device_label:
          type: [string, "null"]
          maxLength: 100
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
    PasswordResetConfirmation:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          description: From 12 characters to 72 bytes, the bcrypt limit.
    SessionGrant:
      type: object
      additionalProperties: false
      required: [user_id, expires_at]
      properties:
        user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          description: Absolute deadline of the session. Inactivity for 30 days ends it sooner.
        token:
          type: string
          description: Only for the mobile client. Send it as Authorization Bearer.
    SessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DeviceSession"
    DeviceSession:
      type: object
      additionalProperties: false
      required: [id, client, device_label, created_at, last_used_at, current]
      properties:
        id:
          type: string
          format: uuid
        client:
          $ref: "#/components/schemas/Client"
        device_label:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session that made this request.
    Motivation:
      type: string
      enum: [start_caring, training_consistency, understand_food, track_progress]
    Profile:
      type: object
      additionalProperties: false
      required: [display_name, time_zone, units, motivations]
      properties:
        display_name:
          type: [string, "null"]
          maxLength: 60
        time_zone:
          type: string
          description: IANA time zone, such as America/Sao_Paulo.
        units:
          type: string
          enum: [metric]
        motivations:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/Motivation"
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: [string, "null"]
          maxLength: 60
        time_zone:
          type: string
          description: IANA time zone. Unknown zones answer 422 invalid_time_zone.
        motivations:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/Motivation"
    Sport:
      type: string
      enum: [running, walking, cycling, strength, swimming, other]
    SportLevel:
      type: string
      enum: [beginner, intermediate, advanced]
    SportProfileRequest:
      type: object
      additionalProperties: false
      required: [sport, level]
      properties:
        sport:
          $ref: "#/components/schemas/Sport"
        level:
          $ref: "#/components/schemas/SportLevel"
    SportProfile:
      type: object
      additionalProperties: false
      required: [id, sport, level, started_at]
      properties:
        id:
          type: string
          format: uuid
        sport:
          $ref: "#/components/schemas/Sport"
        level:
          $ref: "#/components/schemas/SportLevel"
        started_at:
          type: string
          format: date-time
    SportProfileList:
      type: object
      additionalProperties: false
      required: [sport_profiles]
      properties:
        sport_profiles:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/SportProfile"
    FoodSearchRequest:
      type: object
      additionalProperties: false
      required: [term]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 100
        page:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
          description: Values above 50 are served as 50.
    FoodEntryUploadRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, content_type, byte_size, meal_at]
      properties:
        client_request_id:
          type: string
          minLength: 1
          maxLength: 100
          description: Chosen by the client for each meal. Repeating it returns the same meal.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic, image/heif]
        byte_size:
          type: integer
          minimum: 1
          maximum: 10485760
        meal_at:
          type: string
          format: date-time
          description: |
            When the meal happened, ISO 8601 with the UTC offset (Z or +hh:mm), never without one. At most 1 day
            in the future and at most 30 days in the past, counted from the server clock; anything else answers
            422 validation_failed (field meal_at). The local date comes from the profile time zone.
    FoodEntryUpload:
      type: object
      additionalProperties: false
      required: [food_entry_id, status, upload_url, upload_headers, expires_at]
      properties:
        food_entry_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, analyzed, failed, confirmed]
          description: The status of the meal. pending right after the first request.
        upload_url:
          type: [string, "null"]
          description: Signed PUT URL. A secret; never log it. Null when the photo is past the upload.
        upload_headers:
          type: [object, "null"]
          additionalProperties:
            type: string
          description: Content-Type and Content-Length, to send exactly as given. Null with no URL.
        expires_at:
          type: [string, "null"]
          format: date-time
    FoodEntryAnalysisAccepted:
      type: object
      additionalProperties: false
      required: [food_entry_id, status]
      properties:
        food_entry_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing]
    FoodEntry:
      type: object
      additionalProperties: false
      required: [id, status, result_code, source, meal_at, local_date, estimate_partial, unknown_items_count, confidence, photo_url,
                 calories_min, calories_likely, calories_max, protein_g_min, protein_g_likely, protein_g_max, carbs_g_min, carbs_g_likely,
                 carbs_g_max, fat_g_min, fat_g_likely, fat_g_max, items]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, analyzed, failed, confirmed]
        result_code:
          type: [string, "null"]
          enum: [no_food, unreadable, null]
        source:
          type: string
          enum: [photo, manual]
        meal_at:
          type: string
          format: date-time
        local_date:
          type: string
          format: date
        estimate_partial:
          type: boolean
        unknown_items_count:
          type: integer
        confidence:
          type: [string, "null"]
          enum: [high, medium, low, null]
        photo_url:
          type: [string, "null"]
        calories_min:
          type: [integer, "null"]
        calories_likely:
          type: [integer, "null"]
        calories_max:
          type: [integer, "null"]
        protein_g_min:
          type: [integer, "null"]
        protein_g_likely:
          type: [integer, "null"]
        protein_g_max:
          type: [integer, "null"]
        carbs_g_min:
          type: [integer, "null"]
        carbs_g_likely:
          type: [integer, "null"]
        carbs_g_max:
          type: [integer, "null"]
        fat_g_min:
          type: [integer, "null"]
        fat_g_likely:
          type: [integer, "null"]
        fat_g_max:
          type: [integer, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/FoodEntryItem"
    FoodEntryItem:
      type: object
      additionalProperties: false
      required: [id, name, origin, unknown, household_measure, source, own_composition, quantity_grams_min, quantity_grams_likely,
                 quantity_grams_max, calories_min, calories_likely, calories_max, protein_g_min, protein_g_likely, protein_g_max,
                 carbs_g_min, carbs_g_likely, carbs_g_max, fat_g_min, fat_g_likely, fat_g_max]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        origin:
          type: string
          enum: [ai, user]
        unknown:
          type: boolean
        household_measure:
          type: [string, "null"]
        source:
          type: [string, "null"]
          enum: [usda_fdc, project, null]
        own_composition:
          type: boolean
        quantity_grams_min:
          type: number
        quantity_grams_likely:
          type: number
        quantity_grams_max:
