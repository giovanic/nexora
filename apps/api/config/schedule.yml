# Loaded by sidekiq-cron when a worker starts (config/initializers/sidekiq_cron.rb).
# Jobs removed from this file are removed from the schedule.
outbox_publish:
  cron: "* * * * *"
  class: "Shared::Outbox::PublishJob"
  queue: default
  description: "Safety net for the enqueue after commit: delivers pending outbox events."

outbox_reconcile:
  cron: "0 * * * *"
  class: "Shared::Outbox::ReconcileJob"
  queue: default
  description: "Alerts on events older than an hour that a consumer has not applied."

account_deletion_deadline:
  cron: "0 * * * *"
  class: "Identity::DeletionDeadlineJob"
  queue: default
  description: "Enqueues unfinished account erasures again and alerts on those past 24 hours."

outbox_cleanup:
  cron: "30 3 * * *"
  class: "Shared::Outbox::CleanupJob"
  queue: default
  description: "Removes published outbox events, and their consumption marks, 30 days after publication. Dead events are kept until resolved."

identity_retention:
  cron: "45 3 * * *"
  class: "Identity::RetentionJob"
  queue: default
  description: "Removes sessions, audit events and consent records past their retention period."

food_photo_retention:
  cron: "15 4 * * *"
  class: "FoodAi::PhotoRetentionJob"
  queue: default
  description: "Deletes meal photo objects 30 days after analysis, and retries the objects of deleted photos."

food_abandoned_entries:
  cron: "5 * * * *"
  class: "Nutrition::AbandonedEntriesJob"
  queue: default
  description: "Deletes meals still pending after an hour, with their photo and object."

food_analysis_retention:
  cron: "30 4 * * *"
  class: "FoodAi::AnalysisRetentionJob"
  queue: default
  description: "Deletes analyses and raw_response after 90 days, and unlinks the person from usage records of that age."

food_ai_spend_alert:
  cron: "0 6 * * *"
  class: "FoodAi::SpendAlertJob"
  queue: default
  description: "Alerts once per month and limit when the month's AI cost passes FOOD_AI_MONTHLY_ALERT_USD."

food_stuck_entries:
  cron: "*/10 * * * *"
  class: "Nutrition::StuckEntriesJob"
  queue: default
  description: "Resumes meals stuck in processing for more than 15 minutes, or marks them failed."
