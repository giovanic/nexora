# Local defaults match docker-compose.yml, so development starts without a .env.
# DATABASE_URL takes precedence, and production requires it.
default: &default
  adapter: postgresql
  encoding: unicode
  # Large enough for Puma threads and for every Sidekiq thread in the worker.
  max_connections: <%= [ ENV.fetch("RAILS_MAX_THREADS", 5).to_i, ENV.fetch("SIDEKIQ_CONCURRENCY", 5).to_i ].max %>
  connect_timeout: 2
  checkout_timeout: 1

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://app:app_dev@127.0.0.1:5434/app_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://app:app_dev@127.0.0.1:5434/app_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
