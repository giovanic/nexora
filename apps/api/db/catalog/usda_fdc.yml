# Curated subset of USDA FoodData Central for the project food catalog.
#
# Source: https://fdc.nal.usda.gov/download-datasets/ (official downloads page), read on 2026-11-13.
# License: CC0 1.0 Universal. USDA states the data are in the public domain and asks that users list
#   FoodData Central as the source. Suggested citation, as USDA publishes it:
#   "U.S. Department of Agriculture, Agricultural Research Service. FoodData Central, 2019. fdc.nal.usda.gov."
#
# Releases used, as published on the downloads page:
#   sr_legacy_food   SR Legacy, April 2018   (FoodData_Central_sr_legacy_food_csv_2018-04.zip)      source_version "2018-04"
#   foundation_food  Foundation Foods, October 2026 (FoodData_Central_foundation_food_json_2026-10-29.zip)  source_version "2026-10-29"
#
# FDC nutrient numbers behind each per-100 g field (nutrient.csv / "nutrient_nbr"):
#   protein_g  203 (id 1003, Protein)
#   fat_g      204 (id 1004, Total lipid (fat))
#   carbs_g    205 (id 1005, Carbohydrate, by difference)
#   energy_kcal  one rule for every record, written in its energy_nutrient field:
#                208 (id 1008, Energy, KCAL) when the record has it, which is every SR Legacy record;
#                else 958 (id 2048, Energy (Atwater Specific Factors), KCAL);
#                else 957 (id 2047, Energy (Atwater General Factors), KCAL).
#                Foundation Foods records usually lack 208 and carry the Atwater energy instead.
#
# name is the FDC description. name_pt is written by this project. Values are per 100 g, as published,
# with no rounding. The catalog stores only these four fields. Not a medical tool: values are references
# and any meal figure built from them is shown as an estimate range.
#
# Generated from the official files once; the files themselves are not versioned.
source: usda_fdc
