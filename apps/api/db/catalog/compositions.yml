# Home-style Brazilian dishes of this project: plausible recipes written by the project, not measurements
# and not taken from any food composition table. Each dish lists USDA ingredients (db/catalog/usda_fdc.yml,
# by fdc_id) with grams per 100 g of the finished dish, summing to exactly 100. Water counts as an ingredient
# where the dish holds it. Nutrients are the weighted sum of the ingredients, computed when the catalog loads.
# Real dishes vary a lot, so any figure built from these is an estimate.
#
# review: pending_nutritionist. A nutritionist has not reviewed these recipes yet; that review is a
# recorded pending item before the beta (docs/superpowers/specs/2026-11-13-food-ai-design.md, 4.6).
source: project
